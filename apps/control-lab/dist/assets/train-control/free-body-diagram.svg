<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Train longitudinal free-body diagram</title><desc id="desc">A train on level rails with traction to the right, passive and disturbance resistance to the left, normal force upward, and weight downward.</desc>
  <defs><marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#087f83"/></marker><marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d87821"/></marker><marker id="arrowInk" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#10263f"/></marker></defs>
  <rect width="1200" height="520" fill="#f7f9fa"/><line x1="90" y1="390" x2="1110" y2="390" stroke="#52636e" stroke-width="8"/><line x1="90" y1="412" x2="1110" y2="412" stroke="#9aa8ae" stroke-width="4"/>
  <path d="M390 350V235L455 180H800V350Z" fill="#e7edef" stroke="#10263f" stroke-width="6"/><rect x="470" y="205" width="110" height="62" rx="5" fill="#9cd6e3" stroke="#10263f" stroke-width="5"/><rect x="610" y="205" width="110" height="62" rx="5" fill="#9cd6e3" stroke="#10263f" stroke-width="5"/><circle cx="470" cy="365" r="34" fill="#fff" stroke="#10263f" stroke-width="12"/><circle cx="720" cy="365" r="34" fill="#fff" stroke="#10263f" stroke-width="12"/>
  <line x1="800" y1="290" x2="1060" y2="290" stroke="#087f83" stroke-width="10" marker-end="url(#arrowTeal)"/><text x="835" y="255" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#087f83">u &gt; 0: traction</text>
  <line x1="390" y1="315" x2="115" y2="315" stroke="#d87821" stroke-width="10" marker-end="url(#arrowOrange)"/><text x="125" y="275" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#d87821">Froll + c·v + d</text>
  <line x1="595" y1="180" x2="595" y2="55" stroke="#10263f" stroke-width="8" marker-end="url(#arrowInk)"/><text x="620" y="90" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#10263f">normal N</text>
  <line x1="595" y1="350" x2="595" y2="480" stroke="#10263f" stroke-width="8" marker-end="url(#arrowInk)"/><text x="620" y="475" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#10263f">weight m·g</text>
  <text x="90" y="45" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#52636e">LEVEL TRACK: vertical forces cancel; signed longitudinal forces determine acceleration</text>
</svg>
